name: Deploy Arkhos Frontend
on:
  push:
    branches: [ main ] 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
        
      - name: Publish Arkhos Web
        run: dotnet publish Arkhos.Web/Arkhos.Web.csproj -c Release -o publish

      - name: Deploy to Vercel (Direct)
        run: |
          npm install -g vercel
          vercel --token ${{ secrets.VERCEL_TOKEN }} --prod ./publish/wwwroot --yes